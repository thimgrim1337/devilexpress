<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="index.css" />
    <title>DEVIL Express Usługi transportowe</title>
  </head>
  <body class="">
    <div class="container max-w-[1280px]">
      <div class="navbar justify-end border-b-2 gap-2 hidden md:flex">
        <p class="flex items-center gap-2">
          <i class="fa-solid fa-phone text-devil-red"></i> +48 733 533 971
        </p>
        <p class="flex items-center gap-2">
          <i class="fa-solid fa-at text-devil-red"></i> biuro@devilexpress.eu
        </p>
      </div>
      <nav class="navbar bg-base-100">
        <div class="flex-none md:hidden order-2">
          <button class="btn btn-square btn-ghost">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-5 w-5"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M4 6h16M4 12h8m-8 6h16"
              />
            </svg>
          </button>
        </div>
        <div class="flex-1 md:justify-between">
          <a href="" class="btn btn-ghost text-xl"
            ><img src="logo.png" alt="" class="w-20"
          /></a>
        </div>
        <div class="hidden md:block">
          <ul class="menu menu-horizontal px-1">
            <li><a href="">Home</a></li>
            <li><a href="">Oferta</a></li>
            <li><a href="">O nas</a></li>
            <li><a href="">Kontakt</a></li>
          </ul>
        </div>
      </nav>
    </div>
    <section class="hero min-h-screen bg-hero-bg">
      <div class="hero-overlay bg-opacity-60"></div>
      <div class="hero-content text-center text-devil-white">
        <div class="max-w-md">
          <h1 class="mb-2 text-3xl md:text-6xl font-bold uppercase">
            <span class="text-devil-red">Piekielnie</span> szybkie usługi
            transportowe
          </h1>
          <p class="mb-5">Transport krajowy i międzynarodowy</p>
          <button class="btn btn-primary text-devil-white">Kontakt</button>
        </div>
      </div>
    </section>

    <script type="module" src="/main.js"></script>
    <script
      src="https://kit.fontawesome.com/64d703ebee.js"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
